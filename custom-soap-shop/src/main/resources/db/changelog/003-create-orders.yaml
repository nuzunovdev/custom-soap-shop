databaseChangeLog:
  - changeSet:
      id: 004-create-orders
      author: custom-soap-shop
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: customer_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: customer_phone
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(255)
                  defaultValue: NEW
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: customer_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-create-order-items
      author: custom-soap-shop
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: soap_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

              - column:
                  name: unit_price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            constraintName: fk_order_items_order
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: soap_id
            constraintName: fk_order_items_soap
            referencedTableName: soaps
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE