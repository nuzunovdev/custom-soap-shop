app:
  cors:
    allowed-origins: ${FRONTEND_URLS:http://localhost:3000,http://127.0.0.1:3000}

spring:
  application:
    name: custom-soap-shop

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never