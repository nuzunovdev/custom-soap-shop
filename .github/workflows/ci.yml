name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: custom-soap-shop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: custom-soap-shop/pom.xml

      - name: Build and test backend
        run: mvn clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: custom-soap-shop-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom-soap-shop-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: custom-soap-shop/pom.xml

      - name: Build backend JAR
        working-directory: custom-soap-shop
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::186712717814:role/custom-soap-shop-github-deploy-role
          aws-region: eu-central-1

      - name: Upload JAR to S3
        run: |
          aws s3 cp \
            custom-soap-shop/target/custom-soap-shop-0.0.1-SNAPSHOT.jar \
            s3://custom-soap-shop-deploy-uzunov/backend/custom-soap-shop.jar

      - name: Deploy backend with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0a5ba2abc38841fa2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws s3 cp s3://custom-soap-shop-deploy-uzunov/backend/custom-soap-shop.jar /home/ec2-user/custom-soap-shop.jar.new",
              "if [ -f /home/ec2-user/custom-soap-shop.jar ]; then cp /home/ec2-user/custom-soap-shop.jar /home/ec2-user/custom-soap-shop.jar.backup; fi",
              "sudo systemctl stop custom-soap-shop",
              "sudo mv /home/ec2-user/custom-soap-shop.jar.new /home/ec2-user/custom-soap-shop.jar",
              "sudo systemctl start custom-soap-shop",
              "if for i in {1..12}; do curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null && exit 0; sleep 5; done; then exit 0; else echo \"Health check failed. Rolling back...\"; sudo systemctl stop custom-soap-shop; if [ -f /home/ec2-user/custom-soap-shop.jar.backup ]; then sudo cp /home/ec2-user/custom-soap-shop.jar.backup /home/ec2-user/custom-soap-shop.jar; sudo systemctl start custom-soap-shop; for i in {1..12}; do curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null && break; sleep 5; done; fi; exit 1; fi"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a5ba2abc38841fa2"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a5ba2abc38841fa2"
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - frontend
      - deploy-backend

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::186712717814:role/custom-soap-shop-github-deploy-role
          aws-region: eu-central-1

      - name: Start Amplify deployment
        id: amplify
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id d2jxhxp4atsrje \
            --branch-name master \
            --job-type RELEASE \
            --job-reason "GitHub Actions deployment after successful CI and backend deployment" \
            --query "jobSummary.jobId" \
            --output text)

          echo "Amplify Job ID: $JOB_ID"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify deployment
        run: |
          JOB_ID="${{ steps.amplify.outputs.job_id }}"

          for i in {1..60}; do
            STATUS=$(aws amplify get-job \
              --app-id d2jxhxp4atsrje \
              --branch-name master \
              --job-id "$JOB_ID" \
              --query "job.summary.status" \
              --output text)

            echo "Amplify status: $STATUS"

            if [ "$STATUS" = "SUCCEED" ]; then
              echo "Frontend deployment successful."
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || \
               [ "$STATUS" = "CANCELLED" ]; then
              echo "Frontend deployment failed."
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Amplify deployment."
          exit 1