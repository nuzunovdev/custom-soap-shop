name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: custom-soap-shop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: custom-soap-shop/pom.xml

      - name: Build and test backend
        run: mvn clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: custom-soap-shop-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom-soap-shop-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: custom-soap-shop/pom.xml

      - name: Build backend JAR
        working-directory: custom-soap-shop
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::186712717814:role/custom-soap-shop-github-deploy-role
          aws-region: eu-central-1

      - name: Upload JAR to S3
        run: |
          aws s3 cp \
            custom-soap-shop/target/custom-soap-shop-0.0.1-SNAPSHOT.jar \
            s3://custom-soap-shop-deploy-uzunov/backend/custom-soap-shop.jar

      - name: Deploy backend with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0a5ba2abc38841fa2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://custom-soap-shop-deploy-uzunov/backend/custom-soap-shop.jar /home/ec2-user/custom-soap-shop.jar.new",
              "sudo systemctl stop custom-soap-shop",
              "sudo mv /home/ec2-user/custom-soap-shop.jar.new /home/ec2-user/custom-soap-shop.jar",
              "sudo systemctl start custom-soap-shop",
              "sudo systemctl is-active custom-soap-shop"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a5ba2abc38841fa2"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a5ba2abc38841fa2"